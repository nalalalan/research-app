<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo.aolabs.io</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="gate-page">
  <main class="gate">
    <div class="suite-mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <h1>todo</h1>
    <form id="gate-form" class="gate-form">
      <input id="password" type="password" autocomplete="current-password" placeholder="password" autofocus>
      <label class="remember"><input id="remember" type="checkbox" checked> remember device</label>
      <button type="submit">Open</button>
      <p id="gate-error" class="error" hidden>locked</p>
    </form>
  </main>
  <script>
    const form = document.querySelector("#gate-form");
    const input = document.querySelector("#password");
    const remember = document.querySelector("#remember");
    const error = document.querySelector("#gate-error");

    fetch("/api/session")
      .then((response) => response.json())
      .then((session) => {
        if (session.authenticated) window.location.href = "/";
      })
      .catch(() => {});

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      const response = await fetch("/api/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: input.value, remember: remember.checked }),
      });
      if (response.ok) {
        window.location.href = "/";
        return;
      }
      error.hidden = false;
      input.select();
    });
  </script>
</body>
</html>
