<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo.aolabs.io</title>
  <meta name="description" content="Private one-column todo list.">
  <link rel="canonical" href="https://todo.aolabs.io/">
  <link rel="icon" href="/favicon.svg?v=20260525-todo" type="image/svg+xml">
  <link rel="stylesheet" href="https://aolabs.io/suite-header.css?v=20260516-suite-bloom">
  <link rel="stylesheet" href="/styles.css?v=20260525-todo">
</head>
<body>
  <header class="suite-topbar" aria-label="todo navigation">
    <div class="suite-brand-cluster">
      <a class="suite-ao-home" href="https://aolabs.io/" aria-label="aolabs.io">
        <img src="https://aolabs.io/marks/ao-ink.svg?v=20260516-suite-bloom" alt="">
      </a>
      <a class="suite-app-brand" href="/" aria-label="todo home">
        <img class="suite-app-mark" src="/favicon.svg?v=20260525-todo" alt="">
        <span class="suite-app-name">todo.aolabs.io</span>
      </a>
    </div>
    <nav class="suite-topbar-actions" aria-label="todo actions">
      <a href="/api/todo/summary">json</a>
      <button id="logout" type="button">lock</button>
    </nav>
  </header>

  <main class="shell">
    <section class="topline" aria-label="todo state">
      <div>
        <h1>todo</h1>
        <p id="summary-line" class="summary-line">Loading list.</p>
      </div>
      <span id="updated-at" class="updated-at">loading</span>
    </section>

    <section class="todo-panel" aria-label="todo table">
      <form id="todo-form">
        <table class="todo-table">
          <thead>
            <tr>
              <th scope="col">todo</th>
            </tr>
          </thead>
          <tbody>
            <tr class="compose-row">
              <td>
                <input id="todo-input" name="todo" type="text" placeholder="todo" aria-label="todo" required>
                <button id="save-item" type="submit">Add</button>
                <span id="form-status" aria-live="polite"></span>
              </td>
            </tr>
          </tbody>
          <tbody id="todo-list"></tbody>
        </table>
      </form>
    </section>
  </main>

  <script src="/app.js?v=20260525-todo"></script>
</body>
</html>
