<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo.aolabs.io</title>
  <link rel="icon" href="/favicon.svg?v=20260702-brief-stack">
  <link rel="stylesheet" href="/styles.css?v=20260703-category-filters">
</head>
<body>
  <header class="topbar">
    <a class="suite-link" href="https://aolabs.io" aria-label="AO Labs">
      <span class="suite-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
    </a>
    <img class="app-icon" src="/favicon.svg?v=20260702-brief-stack" alt="">
    <h1>todo</h1>
  </header>

  <main class="shell">
    <section class="intake-shell" aria-label="todo intake">
      <textarea id="transcriptInput" class="transcript-input" spellcheck="true" placeholder="paste meeting transcription or note"></textarea>
      <div class="intake-foot">
        <span id="intakeStatus">ready</span>
        <button id="analyzeButton" class="primary-button" type="button">analyze</button>
      </div>
    </section>

    <section class="table-shell" aria-label="todo table">
      <div class="table-head">
        <div class="category-filters" aria-label="todo filters">
          <button class="filter-button" type="button" data-category-filter="paper" aria-pressed="false">paper</button>
          <button class="filter-button" type="button" data-category-filter="prototype" aria-pressed="false">prototype</button>
          <button class="filter-button" type="button" data-category-filter="phd" aria-pressed="false">phd</button>
          <button class="filter-button" type="button" data-category-filter="life" aria-pressed="false">life</button>
        </div>
        <span id="todoCount" class="todo-count">0 todos</span>
      </div>
      <div class="table-scroll">
        <table>
          <colgroup>
            <col class="col-todo">
            <col class="col-ease">
            <col class="col-disney">
            <col class="col-total">
          </colgroup>
          <thead>
            <tr>
              <th aria-sort="none"><button class="sort-button" type="button" data-sort-key="todo">todo</button></th>
              <th aria-sort="none"><button class="sort-button" type="button" data-sort-key="ease">ease /100</button></th>
              <th aria-sort="none"><button class="sort-button" type="button" data-sort-key="disney">disney /100</button></th>
              <th aria-sort="none"><button class="sort-button" type="button" data-sort-key="total">total</button></th>
            </tr>
          </thead>
          <tbody id="items">
            <tr class="loading-row">
              <td colspan="4">loading</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="doneShell" class="table-shell done-shell" aria-label="done todo table" hidden>
      <div class="table-head">
        <span id="doneCount" class="todo-count">0 done</span>
      </div>
      <div class="table-scroll">
        <table>
          <colgroup>
            <col class="col-todo">
            <col class="col-ease">
            <col class="col-disney">
            <col class="col-total">
          </colgroup>
          <thead>
            <tr>
              <th>done</th>
              <th>ease /100</th>
              <th>disney /100</th>
              <th>total</th>
            </tr>
          </thead>
          <tbody id="doneItems"></tbody>
        </table>
      </div>
    </section>

    <section class="transcript-shell" aria-label="transcription PDFs">
      <div class="section-head">
        <h2>transcriptions</h2>
      </div>
      <div id="transcripts" class="transcript-list">
        <div class="empty-transcripts">no transcriptions yet</div>
      </div>
    </section>
  </main>

  <script src="/app.js?v=20260724-life-notes"></script>
</body>
</html>
