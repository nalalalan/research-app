<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo.aolabs.io</title>
  <link rel="icon" href="/favicon.svg?v=20260702-brief-stack">
  <link rel="stylesheet" href="/styles.css?v=20260702-one-button">
</head>
<body>
  <header class="topbar">
    <a class="suite-link" href="https://aolabs.io" aria-label="AO Labs">
      <span class="suite-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </span>
    </a>
    <img class="app-icon" src="/favicon.svg?v=20260702-brief-stack" alt="">
    <h1>todo</h1>
  </header>

  <main class="shell">
    <section class="intake-shell" aria-label="meeting transcript intake">
      <textarea id="transcriptInput" class="transcript-input" spellcheck="true" placeholder="paste meeting transcription"></textarea>
      <div class="intake-foot">
        <span id="intakeStatus">ready</span>
        <button id="analyzeButton" class="primary-button" type="button">analyze</button>
      </div>
    </section>

    <section class="table-shell" aria-label="todo table">
      <div class="table-scroll">
        <table>
          <colgroup>
            <col class="col-todo">
            <col class="col-date-time">
            <col class="col-ease">
            <col class="col-disney">
            <col class="col-total">
          </colgroup>
          <thead>
            <tr>
              <th>todo</th>
              <th>date / time</th>
              <th>ease /100</th>
              <th>disney /100</th>
              <th>total</th>
            </tr>
          </thead>
          <tbody id="items">
            <tr class="loading-row">
              <td colspan="5">loading</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="transcript-shell" aria-label="transcription PDFs">
      <div class="section-head">
        <h2>transcriptions</h2>
      </div>
      <div id="transcripts" class="transcript-list">
        <div class="empty-transcripts">no transcriptions yet</div>
      </div>
    </section>
  </main>

  <script src="/app.js?v=20260702-one-button"></script>
</body>
</html>
